[project]
name = "skyjepa"
version = "0.1.0"
description = "Toy SkyJEPA latent world model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "matplotlib>=3.8",
    "pandas>=3.0.6",
    "projectairsim==1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skyjepa"]
